name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip unzip
      - name: Verify marketplace metadata
        run: lua5.1 scripts/check-marketplace.lua dogearbooks.koplugin/_meta.lua dogearbooks VERSION
      - name: Check Lua syntax
        run: find dogearbooks.koplugin -type f -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p
      - name: Build and verify package
        run: |
          ./scripts/package.sh
          unzip -t dist/dogearbooks.koplugin.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          source = Path('dogearbooks.koplugin')
          expected = {p.as_posix(): p.read_bytes() for p in source.rglob('*') if p.is_file()}
          with ZipFile('dist/dogearbooks.koplugin.zip') as z:
              actual = {n: z.read(n) for n in z.namelist() if not n.endswith('/')}
          assert expected == actual, 'Package differs from source'
          assert 'dogearbooks.koplugin/main.lua' in actual
          print(f'Verified {len(actual)} packaged files')
          PY
